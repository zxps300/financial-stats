<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC Youth Fund Tracker</title>
<meta name="description" content="Monitor BTC Youth ministry funds: income, expenses, event budgets, member contributions and reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest-cloud.webmanifest">
<meta name="theme-color" content="#151a33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="bg-orbs"></div>
<aside class="sidebar">
  <div class="brand"><span class="logo">B</span><div><strong>BTC Youth</strong><small>Fund Tracker</small></div></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="monthly" id="nav-monthly"><span class="ni">📅</span><span class="nl nl-full">Monthly Sheet</span><span class="nl nl-short">Monthly</span></button>
    <button class="nav-btn" data-view="dashboard" id="nav-dashboard"><span class="ni">📊</span><span class="nl nl-full">Dashboard</span><span class="nl nl-short">Home</span></button>
    <button class="nav-btn" data-view="transactions" id="nav-transactions"><span class="ni">💸</span><span class="nl nl-full">Transactions</span><span class="nl nl-short">Ledger</span></button>
    <button class="nav-btn" data-view="events" id="nav-events"><span class="ni">🎯</span><span class="nl nl-full">Events &amp; Budgets</span><span class="nl nl-short">Events</span></button>
    <button class="nav-btn" data-view="members" id="nav-members"><span class="ni">👥</span><span class="nl nl-full">Members</span><span class="nl nl-short">Members</span></button>
    <button class="nav-btn" data-view="reports" id="nav-reports"><span class="ni">📄</span><span class="nl nl-full">Reports</span><span class="nl nl-short">Reports</span></button>
    <button class="nav-btn" data-view="team" id="nav-team"><span class="ni">🔑</span><span class="nl nl-full">Team &amp; roles</span><span class="nl nl-short">Team</span></button>
  </nav>
  <div class="side-foot">
    <div class="user" id="user-label"></div>
    <label class="side-currency">Currency <input id="currency" maxlength="4"></label>
    <button class="btn ghost" id="tools-btn" aria-label="Tools and data"><span class="ic">⚙️</span><span class="lbl"> Tools &amp; Data</span></button>
    <button class="btn ghost" id="logout-btn" aria-label="Sign out"><span class="ic">🚪</span><span class="lbl"> Sign out</span></button>
  </div>
</aside>

<main>
  <header class="topbar">
    <h1 id="page-title">Monthly Sheet</h1>
    <div class="actions">
      <select id="year-select" aria-label="Year filter" style="width:auto"></select>
      <button class="btn" id="add-income-btn">+ Income</button>
      <button class="btn alt" id="add-expense-btn">+ Expense</button>
    </div>
  </header>
  <section id="view"></section>
</main>

<div class="modal-wrap" id="modal-wrap"><div class="modal" id="modal"></div></div>

<div class="modal-wrap open" id="auth-wrap">
  <div class="modal auth pin-auth">
    <div class="brand" style="justify-content:center;margin-bottom:10px"><span class="logo">B</span><div><strong>BTC Youth</strong><small>Fund Tracker</small></div></div>
    <p class="mute" style="text-align:center;font-size:12px;margin-bottom:14px">🔒 Enter your 6-digit Owner PIN</p>
    <form id="auth-form">
      <div class="pin-dots" id="pin-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <input type="password" id="pin-input" name="pin" inputmode="numeric" pattern="[0-9]*" minlength="6" maxlength="6" autocomplete="current-password" placeholder="6-digit PIN" class="pin-hidden-input" required>
      <div class="pin-pad" id="pin-pad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="clear" class="pin-fn">Clear</button><button type="button" data-k="0">0</button><button type="button" data-k="back" class="pin-fn">⌫</button>
      </div>
      <button class="btn" id="auth-submit" style="margin-top:6px">Unlock</button>
      <p class="mute" id="auth-msg" style="color:var(--warn);text-align:center;min-height:18px"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="app-core.js"></script>
<script src="cloud.js"></script>
<script src="import-excel.js"></script>
<script src="features.js"></script>
</body>
</html>
